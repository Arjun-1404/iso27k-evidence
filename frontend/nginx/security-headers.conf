# Headers every answer from the web app carries. Included from each `location` of default.conf, because nginx drops the
# headers set at one level as soon as a lower level sets any of its own. The same policy is in scripts/serve-web.mjs (the
# no-Docker web server); a test keeps the two identical.
#
# Content-Security-Policy: scripts and styles may come only from the app itself, nothing can be framed, embedded or
# redirected to another base address. `connect-src` is open to http(s) because the API lives at an address chosen at
# build time and evidence uploads go straight to the storage provider (Google Drive, for one).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
