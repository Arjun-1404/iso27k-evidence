server {
  listen 80;
  server_tokens off;                 # don't announce the nginx version
  root /usr/share/nginx/html;

  # The build gives every file in /assets a name made from its content, so it can be kept for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # A single-page app needs every path to fall back to index.html so client-side routing (react-router)
  # works on a hard refresh of e.g. /controls, not just on in-app navigation.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
