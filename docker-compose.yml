services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: evidenceportal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    # Same image as `api` (built once, below) — two services each building it would run the whole install twice at once.
    image: evidence-portal-api:local
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/evidenceportal
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      # Used when this service runs the one-off admin commands (db:bootstrap-admin builds the invite link from it).
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    # This service connects as the database owner, so it is also where those admin commands run: the api service
    # connects as the restricted portal_app role, which is deliberately not allowed to create organisations.
    command: npm run db:setup
    restart: "no"

  api:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: evidence-portal-api:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://portal_app:${APP_DB_PASSWORD}@db:5432/evidenceportal
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env (generate one with: openssl rand -hex 32)}"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      # Browser origins allowed to call the API (comma-separated). Defaults to the app's own address.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${APP_BASE_URL:-http://localhost:5173}}
      # Number of reverse proxies in front of the API (0 = the browser connects directly). Set it to 1 when
      # you put one in front, so the per-address request limits see the real visitor. See .env.example.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Where evidence can be kept besides Google Drive / S3. Empty = the "this server's disk" option is not offered.
      # To use it, set LOCAL_STORAGE_DIR=/data/evidence in .env: that folder is the evidence-files volume below.
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-}
      # true = S3 services on private addresses (your own MinIO) may be used. Leave false on a shared installation.
      STORAGE_ALLOW_PRIVATE_ADDRESSES: ${STORAGE_ALLOW_PRIVATE_ADDRESSES:-false}
      PORT: "3000"
      # Optional: only needed to let an org admin connect Google Drive. Empty = Drive features answer
      # "not configured" (503) instead of the server refusing to start. All three GOOGLE_* or none.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      # Optional email (SMTP). Empty = emails are printed to the API log instead of being sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Optional malware scanning. Empty = uploads are recorded as "skipped" (not scanned).
      CLAMD_HOST: ${CLAMD_HOST:-}
      CLAMD_PORT: ${CLAMD_PORT:-}
      CLAMD_TIMEOUT_SECONDS: ${CLAMD_TIMEOUT_SECONDS:-}
      CLAMD_MAX_FILE_MB: ${CLAMD_MAX_FILE_MB:-}
    volumes:
      # Where "this server's disk" evidence lives when LOCAL_STORAGE_DIR=/data/evidence. Back this volume up.
      - evidence-files:/data/evidence
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    # Named explicitly so the image can also be built by hand (docker build --network=host, see README troubleshooting).
    image: evidence-portal-frontend:local
    build:
      context: ./frontend
      args:
        # The browser talks to this directly, so it must be reachable from the user's machine, not
        # just inside the Docker network — the Docker-internal service name "api" wouldn't work here.
        VITE_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:3000}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  # ---- Optional services (start them with --profile <name>) ------------------------------------------
  # ClamAV: set CLAMD_HOST=clamav in .env, then   docker compose --profile scanning up
  # Needs roughly 2 GB of memory; the first start downloads virus signatures and can take a few minutes
  # (its healthcheck reports healthy once the daemon is ready).
  clamav:
    image: clamav/clamav:stable
    profiles: ["scanning"]
    volumes:
      - clamav-signatures:/var/lib/clamav
    restart: unless-stopped

  # A local "mail catcher" for trying the portal without a real mail account: every email the portal sends
  # shows up at http://localhost:8025 instead of going anywhere. Set SMTP_HOST=mailpit, SMTP_PORT=1025,
  # SMTP_SECURITY=none and EMAIL_FROM=noreply@portal.local in .env, then   docker compose --profile dev-mail up
  # For trying things out only — never point a real deployment at it.
  mailpit:
    image: axllent/mailpit
    profiles: ["dev-mail"]
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  db-data:
  evidence-files:
  clamav-signatures:
